# Pin the light theme: the chart palette in streamlit_app.py was validated for
# contrast and colorblind separation against a light chart surface.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[server]
headless = true
